body{padding-top:84px}

<body><div id="app"></div>
<script>
"use strict";
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const W=["ombak","karang","pantai","camar","kerang","pasir","teluk","buih","layar","dermaga","laguna","penyu","tiram","samudra","bahari","lumba"];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
const gen=()=>W[rnd(W.length)]+"-"+(100+rnd(900));
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,"-");
const NOTE=["#e3f3fb","#dcf5ee","#e8eefb","#fdf3e0"],TAPE=["#8fc9dd","#8fd3c3","#a9bde0","#9fd0a8"];
const VIS={privat:"Privat",link:"Dengan link",publik:"Publik"};
const TR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const unl=new Set();
async function hp(p){try{const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("daynote:"+p));return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa("daynote:"+p)}}
function ask(msg,yes){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="dlg" role="dialog"><p>${msg}</p><div class="row" style="margin:20px 0 0"><button class="bt o" id="n">Batal</button><button class="bt dg" id="y">Ya, hapus</button></div></div>`;document.body.appendChild(o);o.querySelector("#n").onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};o.querySelector("#y").onclick=()=>{o.remove();yes()}}
function pin(title,sub,fn,cancel){const o=document.createElement("div");o.className="ov";o.innerHTML=`<div class="dlg" role="dialog"><h3 style="font-size:24px">${title}</h3><p class="mu" id="pm" style="margin-top:6px">${sub||""}</p><input class="fld pn" id="pi" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••"><div class="row" style="margin:18px 0 0"><button class="bt o" id="n">Batal</button><button class="bt" id="y">OK</button></div></div>`;document.body.appendChild(o);const i=o.querySelector("#pi"),m=o.querySelector("#pm");i.focus();
 o.querySelector("#n").onclick=()=>{o.remove();cancel&&cancel()};
 const go=async()=>{const v=i.value.replace(/\D/g,"");if(v.length<4){m.textContent="PIN minimal 4 angka.";return}const r=await fn(v);if(r===true)o.remove();else{m.textContent=r||"PIN salah.";i.value="";i.focus()}};
 o.querySelector("#y").onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()}}
function openE(id){const e=J.entries.find(x=>x.id===id);if(e.pin&&!unl.has(id))pin("Tulisan terkunci","Masukkan PIN tulisan ini.",async p=>{if(await hp(p)===e.pin){unl.add(id);edit(id);return true}return"PIN salah."});else edit(id)}
const fmt=t=>new Date(t).toLocaleDateString(LG==="en"?"en-US":"id-ID",{day:"numeric",month:"long",year:"numeric"});
/* storage: IndexedDB, with in-memory fallback */
const mem={};
const idb=new Promise(r=>{try{const q=indexedDB.open("lembar",1);q.onupgradeneeded=()=>q.result.createObjectStore("j");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const get=k=>idb.then(d=>new Promise(r=>{if(!d)return r(mem[k]||null);try{const q=d.transaction("j").objectStore("j").get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}}));
const put=(k,v)=>idb.then(d=>new Promise(r=>{if(!d){mem[k]=v;return r()}try{const t=d.transaction("j","readwrite");t.objectStore("j").put(v,k);t.oncomplete=r;t.onerror=r}catch(e){r()}}));
let J=null,timer;
const st=t=>{const e=$("#st");if(e)e.textContent=t};
function save(){clearTimeout(timer);st("menyimpan…");timer=setTimeout(async()=>{await put("j:"+J.code,J);try{localStorage.setItem("lembar_code",J.code)}catch(e){}st("tersimpan")},400)}
async function openJ(code){const d=await get("j:"+norm(code));if(!d)return false;
 const fin=()=>{J=d;try{localStorage.setItem("lembar_code",J.code)}catch(e){}home()};
 if(!d.pin){fin();return true}
 if(!app.innerHTML.trim())gate();
 await new Promise(res=>pin("Daynote terkunci","Masukkan PIN jurnalmu.",async p=>{if(await hp(p)===d.pin){fin();res();return true}return"PIN salah."},()=>{gate();res()}));return true}
async function boot(){gate()}
const copy=t=>{try{navigator.clipboard.writeText(t)}catch(e){}};

/* gate */
function gate(msg){app.className="";
 app.innerHTML=`<header class="top"><span class="logo">Daynote</span><span class="mu">tanpa akun, tanpa email</span></header>
 <section class="hero"><p class="lb">Jurnal pribadi</p>
 <h1>Tulis Bebas. <em>Tanpa Identitas.</em></h1>
 <p>Gunakan nama samaran, selipkan kliping foto, dan susun catatanmu seperti buku tempel digital (scrapbook). Semua tersimpan aman, cukup diakses pakai satu kode unik atau kunci PIN rahasia.</p>
 <div class="row"><button class="bt" id="new">Mulai menulis</button></div>
 <div class="box"><p class="lb">Sudah punya kode?</p>
 <div class="row" style="margin-top:0"><input class="fld" id="cd" placeholder="mis. ombak-482" autocomplete="off" spellcheck="false"><button class="bt o" id="go">Buka</button></div>
 <p class="mu" id="msg" style="margin:10px 0 0">${msg||""}</p>
 <p class="mu" style="margin-top:22px"><label class="ln" style="cursor:pointer">Pulihkan dari file cadangan<input type="file" id="imp" accept=".json" hidden></label></p></div></section>`;
 $("#new").onclick=()=>{const code=gen();J={code,pen:"Penulis tanpa nama",entries:[],view:"book"};put("j:"+code,J);try{localStorage.setItem("lembar_code",code)}catch(e){}
  app.innerHTML=`<header class="top"><span class="logo">Daynote</span></header><section class="hero"><p class="lb">Kodemu</p><h2 style="font-size:32px">Simpan kode ini baik-baik.</h2>
  <div class="code" id="cc">${code}</div><div class="warn"><b>Harap Diingat!</b> Kode unik ini harus kamu simpan untuk membuka kembali jurnal yang telah kamu tulis.</div><p>Inilah satu-satunya “kunci” jurnalmu. Tidak ada email atau kata sandi, jadi kami tidak bisa memulihkannya kalau hilang. Catat, atau salin sekarang.</p>
  <div class="row"><button class="bt o" id="cp">Salin kode</button><button class="bt" id="ok">Sudah kusimpan, lanjut</button></div></section>`;
  $("#cp").onclick=e=>{copy(code);e.target.textContent="Tersalin"};$("#ok").onclick=home};
 const go=async()=>{const v=$("#cd").value;if(!v.trim())return;if(!await openJ(v))$("#msg").textContent="Kode ini belum ada di perangkat ini. Kalau jurnalmu dibuat di perangkat lain, pulihkan dari file cadangan."};
 $("#go").onclick=go;$("#cd").onkeydown=e=>{if(e.key==="Enter")go()};
 $("#imp").onchange=e=>imp(e.target.files[0]);
